<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queen's Protocol: Ultimate Master Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: radial-gradient(circle, #0d0d0d 0%, #050505 100%); /* Premium Midnight Black */
            color: #f3f4f6; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        .main-container { 
            width: 90%; 
            max-width: 900px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            margin-top: 20px; 
        }
        .header-panel { 
            background: linear-gradient(135deg, #111111 0%, #1a1a1a 100%); 
            padding: 25px; 
            border-radius: 20px; 
            text-align: center; 
            border: 1px solid #d4af37; /* Burnished Royal Gold Border */
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.1); 
        }
        h1 { 
            margin: 0; 
            background: linear-gradient(135deg, #fceb92 0%, #d4af37 50%, #aa7c11 100%); /* Real Liquid Gold Text Gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; 
            font-size: 32px; 
            font-weight: 800; 
            letter-spacing: 0.5px;
        }
        .dashboard-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }
        @media(max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .panel-card { 
            background: rgba(18, 18, 18, 0.85); /* Solid Matte Black Core */
            padding: 25px; 
            border-radius: 16px; 
            border: 1px solid #94a3b8; /* Brushed Metallic Silver Border */
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .panel-card:hover {
            transform: translateY(-5px);
            border-color: #e2e8f0; 
            box-shadow: 0 10px 25px rgba(255,255,255,0.05);
        }
        h3 { 
            margin-top: 0; 
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%); /* Polished Silver Heading Gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2); 
            padding-bottom: 10px; 
        }
        .input-box { 
            width: 100%; 
            padding: 12px; 
            background: #000000; /* Pure Black Input Fields */
            border: 1px solid #475569; 
            border-radius: 8px; 
            color: #f3f4f6; 
            margin-bottom: 15px; 
            box-sizing: border-box; 
            outline: none; 
            transition: all 0.3s; 
        }
        .input-box:focus { 
            border-color: #d4af37; 
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2); 
        }
        .action-btn { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #fceb92 0%, #d4af37 100%); /* Solid Gold Heavy Metallic Button */
            border: none; 
            color: #000000; 
            border-radius: 8px; 
            font-weight: 800; 
            font-size: 15px;
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        .action-btn:hover { 
            background: linear-gradient(135deg, #ffffff 0%, #d4af37 100%);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4); 
            transform: translateY(-1px);
        }
        .action-btn:active { transform: scale(0.99); }
        .display-list { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; }
        .display-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: #000000; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            border: 1px solid rgba(148, 163, 184, 0.15); 
            font-size: 14px; 
        }
        .crypto-grid { display: flex; gap: 15px; justify-content: space-between; margin-top: 15px; }
        .crypto-mini-frame { 
            background: #000000; 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            flex: 1; 
            border: 1px solid #d4af37; /* Gold Frame accenting */
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.05);
        }
        .crypto-title { font-size: 14px; color: #94a3b8; font-weight: 500; }
        .crypto-val { font-size: 18px; font-weight: bold; color: #d4af37; margin-top: 6px; }
        .delete-btn {
            background: none;
            border: 1px solid #f87171;
            color: #f87171;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.3s;
        }
        .delete-btn:hover {
            background: #f87171;
            color: #000;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-panel">
        <h1>Queen's Executive Command Dashboard</h1>
        <p style="color: #94a3b8; margin: 8px 0 0 0; font-size: 14px; font-weight: 500; letter-spacing: 1px;">METALLIC PORTFOLIO INTEGRATION ENGINE</p>
    </div>

    <div class="dashboard-grid">
        <div class="panel-card">
            <h3>Secure Asset Allocation</h3>
            <div>
                <input type="text" id="assetName" class="input-box" placeholder="Asset Name (Min 3 characters)">
                <input type="number" id="assetValue" class="input-box" placeholder="Investment Budget (USD)">
                <button class="action-btn" id="saveAssetBtn">Lock Asset</button>
            </div>
        </div>

        <div class="panel-card">
            <h3>Live Ledger Watchlist</h3>
            <ul class="display-list" id="ledgerList"></ul>
        </div>
    </div>

    <div class="panel-card">
        <h3>Global Live Tickers (Modular Framework Engine)</h3>
        <div class="crypto-grid" id="tickerContainer"></div>
    </div>
</div>

<script>
    const assetNameInput = document.getElementById('assetName');
    const assetValueInput = document.getElementById('assetValue');
    const saveAssetBtn = document.getElementById('saveAssetBtn');
    const ledgerList = document.getElementById('ledgerList');
    const tickerContainer = document.getElementById('tickerContainer');

    let assetWatchlist = JSON.parse(localStorage.getItem('queens_gold_ledger')) || [];

    const marketTickersData = [
        { coin: "BTC", value: "$68,420", symbol: "🪙" },
        { coin: "ETH", value: "$2,650", symbol: "🔷" },
        { coin: "SOL", value: "$175", symbol: "⚡" }
    ];

    function TickerCardComponent(props) {
        return `
            <div class="crypto-mini-frame">
                <div class="crypto-title">${props.symbol} ${props.coin}</div>
                <div class="crypto-val">${props.value}</div>
            </div>
        `;
    }

    function renderTickerFramework() {
        let tickerHtmlAccumulator = '';
        marketTickersData.forEach(ticker => {
            tickerHtmlAccumulator += TickerCardComponent(ticker);
        });
        tickerContainer.innerHTML = tickerHtmlAccumulator;
    }

    function displayLedger() {
        ledgerList.innerHTML = ''; 
        
        if (assetWatchlist.length === 0) {
            ledgerList.innerHTML = `<li class="display-item" style="color: #94a3b8; justify-content: center;">No assets locked in secure storage.</li>`;
            return;
        }

        assetWatchlist.forEach((asset, index) => {
            const li = document.createElement('li');
            li.className = 'display-item';
            li.innerHTML = `
                <span>✨ <strong style="color: #d4af37;">${asset.name}</strong> — $${parseFloat(asset.budget).toLocaleString()} USD</span>
                <button class="delete-btn" onclick="removeAsset(${index})">Release</button>
            `;
            ledgerList.appendChild(li);
        });
    }

    function addNewAsset() {
        const nameValue = assetNameInput.value.trim();
        const budgetValue = assetValueInput.value.trim();

        if (nameValue === "" || budgetValue === "") {
            return alert("Error: Asset details can never be left empty!");
        }
        if (nameValue.length < 3) {
            return alert("Error: Asset name must be at least 3 characters long.");
        }
        if (parseFloat(budgetValue) <= 0) {
            return alert("Error: Investment budget must be a positive number.");
        }

        const secureAsset = {
            name: nameValue,
            budget: budgetValue
        };

        assetWatchlist.push(secureAsset); 
        syncWithStorage(); 
        displayLedger(); 
        
        assetNameInput.value = '';
        assetValueInput.value = '';
    }

    window.removeAsset = function(index) {
        assetWatchlist.splice(index, 1); 
        syncWithStorage();
        displayLedger();
    };

    function syncWithStorage() {
        localStorage.setItem('queens_gold_ledger', JSON.stringify(assetWatchlist));
    }

    saveAssetBtn.addEventListener('click', addNewAsset);
    assetValueInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addNewAsset();
    });

    displayLedger();
    renderTickerFramework();
</script>
</body>
</html>
